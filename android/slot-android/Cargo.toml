[package]
name = "slot-android"
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-or-later"
description = "Slotted: Android emulator registry and JNI glue."
publish = false

# Standalone: do not join the top-level Slot workspace (keeps Brick/SP CI unchanged).
[workspace]

[lib]
name = "slot_android"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
log = "0.4"
android_logger = "0.14"
libloading = "0.8"
