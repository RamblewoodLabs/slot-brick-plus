# Slotted on the Anbernic RG280V — OpenDingux standalone / RetroArch launchers
# for the 21 shipped shelves. N64, DS and PSP are not listed.
#
# Copy this file to Slot/Config/launchers.ini on TF2 to override names or
# paths without rebuilding the OPK. {rom} is the selected game. We never
# download BIOS; place any BIOS Jeff already has in Slot/BIOS/ or in the
# directory the emulator already documents.
#
# Default action: run `opkrun <first-found-opk> <rom>`. If no OPK is in the
# search path, run `retroarch -L <first-found-core> <rom>`. An `exec=` line
# replaces both.

[paths]
search = /media/data/apps:/media/sdcard/apps:/media/ext/apps:/usr/local/share/OPKs:/media/data/local/home/.apps
cores  = /usr/lib/libretro:/media/data/local/home/.retroarch/cores:/usr/local/lib/libretro

[gb]
opk = gambatte.opk,Gambatte.opk,mGBA.opk,mgba.opk
retroarch_core = gambatte_libretro.so,mgba_libretro.so

[gbc]
opk = gambatte.opk,Gambatte.opk,mGBA.opk,mgba.opk
retroarch_core = gambatte_libretro.so,mgba_libretro.so

[gba]
opk = ReGBA.opk,regba.opk,gpSP.opk,gpsp.opk,mGBA.opk
retroarch_core = gpsp_libretro.so,mgba_libretro.so

[nes]
opk = fceux.opk,FCEUX.opk,FCEUX_new.opk
retroarch_core = fceumm_libretro.so,fceux_libretro.so

[snes]
opk = PocketSNES_new.opk,PocketSNES.opk,pocketsnes.opk,snes9x.opk,Snes9x.opk
retroarch_core = pocketsnes_libretro.so,snes9x2005_libretro.so,snes9x_libretro.so

[ps1]
opk = pcsx4all.opk,PCSX4All.opk,PCSX-ReARMed.opk,pcsx_rearmed.opk
retroarch_core = pcsx_rearmed_libretro.so

[md]
opk = PicoDrive.opk,picodrive.opk,GenesisPlusGX.opk,genplus.opk
retroarch_core = picodrive_libretro.so,genesis_plus_gx_libretro.so

[sms]
opk = PicoDrive.opk,picodrive.opk,SMSPlusGX.opk,smsplus.opk,GenesisPlusGX.opk
retroarch_core = picodrive_libretro.so,genesis_plus_gx_libretro.so,smsplus_libretro.so

[gg]
opk = PicoDrive.opk,picodrive.opk,GenesisPlusGX.opk,SMSPlusGX.opk
retroarch_core = picodrive_libretro.so,genesis_plus_gx_libretro.so

[pce]
opk = temper.opk,Temper.opk,Temper_new.opk
retroarch_core = mednafen_pce_fast_libretro.so,pce_fast_libretro.so

[a2600]
opk = stella.opk,Stella.opk
retroarch_core = stella2014_libretro.so,stella_libretro.so

[a7800]
opk = prosystem.opk,ProSystem.opk
retroarch_core = prosystem_libretro.so

[a5200]
opk = a5200.opk,atari800.opk,Atari800.opk
retroarch_core = a5200_libretro.so,atari800_libretro.so

[a800]
opk = atari800.opk,Atari800.opk
retroarch_core = atari800_libretro.so

[lynx]
opk = handy.opk,Handy.opk
retroarch_core = handy_libretro.so

[coleco]
opk = SMSPlusGX.opk,smsplus.opk,colem.opk,CoolCV.opk
retroarch_core = gearcoleco_libretro.so,smsplus_libretro.so

[intv]
opk = jzintv.opk,freeintv.opk,FreeIntv.opk
retroarch_core = freeintv_libretro.so

[gw]
opk = gw.opk,GameAndWatch.opk
retroarch_core = gw_libretro.so

[vectrex]
opk = vecx.opk,VecxEmu.opk,vecxemu.opk
retroarch_core = vecx_libretro.so

[arcade]
# FinalBurn Alpha is the usual JZ4770 choice; FBNeo only if a build is on the card.
opk = fba.opk,FBA.opk,fbalpha.opk,FBAlpha.opk,fbneo.opk,FBNeo.opk
retroarch_core = fbalpha_libretro.so,fbneo_libretro.so

[32x]
opk = PicoDrive.opk,picodrive.opk
retroarch_core = picodrive_libretro.so
