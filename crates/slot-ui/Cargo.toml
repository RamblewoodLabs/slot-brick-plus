[package]
name = "slot-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fontdue = { workspace = true }
png = { workspace = true }
resvg = { workspace = true }
usvg = { workspace = true }
slot-gfx = { path = "../slot-gfx", default-features = false }
slot-power = { path = "../slot-power" }
slot-store = { path = "../slot-store" }
slot-cartart = { path = "../slot-cartart" }

[dev-dependencies]
slot-cartart = { path = "../slot-cartart" }
slot-gfx = { path = "../slot-gfx", features = ["test-support"] }
tempfile.workspace = true

[features]
brick = []
rg35xxsp = ["brick"]
# Anbernic RG280V / Slotted: hide N64/DS/PSP rows, downscale insert frames.
rg280v = ["slot-store/rg280v"]
