[package]
name = "slot-gfx"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
brick = ["device"]
rg35xxsp = ["brick"]
# Anbernic RG280V: SDL2 + GLES2 (or a failed-context error), 320x240 letterbox.
rg280v = ["device"]
default = ["host"]
host = ["dep:glutin", "dep:glutin-winit", "dep:winit", "dep:raw-window-handle"]
device = []
test-support = []
sim = ["brick"]

[dependencies]
gl = { workspace = true }
libloading = { workspace = true }
glutin = { workspace = true, optional = true }
glutin-winit = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
