# arcade: Blender render of the arcade shell (~/Projects/slot-cart-renders, scripts/carts.py).
# Shell is 360x122 RGBA, downscaled from a 960 px master (360 wide, or 331 tall at most). Real cart 260.0x80.0 mm.
# Label window in shell pixels, origin top-left, y down. mask.png keeps the recess corners;
# shade.png (when present) multiplies the label with the light it would catch on the cart.
x = 15
y = 16
w = 330
h = 90
rotation = 0.0
aspect = 3.6667
# A lit marquee: the label glows instead of taking shade.
backlit = true
